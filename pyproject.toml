[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ssleye"
version = "0.2.0"
description = "An inside view to your SSL model: watch a self-supervised encoder learn."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Faisal Alherran" }]
requires-python = ">=3.9"
dependencies = ["torch", "numpy", "pillow"]

[project.optional-dependencies]
full = ["scikit-learn"]

[project.scripts]
ssleye = "ssleye.__main__:main"

[project.urls]
Homepage = "https://github.com/fherran/ssleye"

[tool.setuptools]
packages = ["ssleye"]

[tool.setuptools.package-data]
ssleye = ["static/*"]
